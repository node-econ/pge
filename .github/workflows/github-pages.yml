# Publishes static HTML under data/utilities/, web/*.html, and data/wildfire/* to GitHub Pages.
# Repo → Settings → Pages: set "Source" to GitHub Actions (not "Deploy from a branch").
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/utilities
          : > _site/.nojekyll
          cp web/index.html _site/index.html
          test -f web/nri_wfir_exposure.html || { echo "missing: web/nri_wfir_exposure.html (run scripts/nri_wfir_exposure_by_riskr.py)" >&2; exit 1; }
          cp web/nri_wfir_exposure.html _site/nri_wfir_exposure.html
          test -f web/NRI_Census_Tracts_PGE.geojson || { echo "missing: web/NRI_Census_Tracts_PGE.geojson (run scripts/export_nri_pge_geojson.py)" >&2; exit 1; }
          cp web/NRI_Census_Tracts_PGE.geojson _site/NRI_Census_Tracts_PGE.geojson
          test -f web/wfigs_incidents_or_wa.html || { echo "missing: web/wfigs_incidents_or_wa.html" >&2; exit 1; }
          cp web/wfigs_incidents_or_wa.html _site/wfigs_incidents_or_wa.html
          mkdir -p _site/wildfire
          for f in \
            data/wildfire/wfigs_incident_locations_or.geojson \
            data/wildfire/transmission_lines_wgs84.geojson \
            data/wildfire/incidents_nearest_transmission.json \
            data/wildfire/incidents_nearest_transmission.csv \
            data/wildfire/incidents_nearest_transmission.md
          do
            test -f "$f" || { echo "missing: $f (run scripts after wfigs_incident_locations_fetch.py)" >&2; exit 1; }
            cp "$f" _site/wildfire/
          done
          for f in \
            data/utilities/pge_oas_debt_dashboard.html \
            data/utilities/ice_bofa_oas_line_chart.html
          do
            test -f "$f" || { echo "missing: $f" >&2; exit 1; }
            cp "$f" _site/utilities/
          done
          test -d data/utilities/ferc1_pge_viewer || { echo "missing dir: data/utilities/ferc1_pge_viewer" >&2; exit 1; }
          cp -r data/utilities/ferc1_pge_viewer _site/utilities/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
